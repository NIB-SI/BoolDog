[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "BoolDog"
authors = [
  { name="Carissa Bleker", email="carissa.bleker@nib.si" },
]
description = "A Python package for analyses of Boolean and semi-quantitative Boolean networks."
keywords = ["boolean networks", "systems biology", "computational biology", "network analysis"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0"
license-files = ["LICENSE"]

version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
        'pyboolnet==3.0.16',
        'matplotlib>=3.4',
        'numpy>=1.20',
        'scipy>=1.6',
        'xmltodict>=0.13.0'
]

[project.optional-dependencies]
# igraph is pinned here too (not just in `networks`) because `tabularqual`
# transitively depends on `py4cytoscape`, which requires an unconstrained
# `igraph`. Without this pin, Poetry's resolver can non-deterministically
# select igraph>=1.0.0 instead of our pin when `sbml` and `networks` are
# installed together, due to a Poetry lock-file bug:
# https://github.com/python-poetry/poetry/issues/10971
# igraph>=1.0.0 has a GraphML edge-id import regression we rely on avoiding:
# https://github.com/igraph/igraph/issues/2892
sbml = ["python-libsbml>=5.19", "tabularqual", "igraph==0.11.9"]
networks = ["networkx", "igraph==0.11.9"]
graphviz = ["pygraphviz"]
biomodels = ["requests>=2.25"]
all = ["python-libsbml>=5.19", "tabularqual", "networkx", "igraph==0.11.9", "pygraphviz", "requests>=2.25"]

# for development
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-autoapi", "nbsphinx", "nbsphinx-link", "ipython"]
test = ["vcrpy"]

[tool.setuptools.packages.find]
include = ["booldog*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
booldog = ["resources/*"]

[project.urls]
Homepage = "https://github.com/NIB-SI/BoolDog"
Repository = "https://github.com/NIB-SI/BoolDog"
Issues = "https://github.com/NIB-SI/BoolDog/issues"
Documentation = "https://nib-si.github.io/BoolDog/"
