      string: "{\r\n  \"name\" : \"Begitt2014 - STAT1 cooperative DNA binding - single
        GAS polymer model\",\r\n  \"description\" : \"<notes xmlns=\\\"http://www.sbml.org/sbml/level2/version4\\\">
        \     <body xmlns=\\\"http://www.w3.org/1999/xhtml\\\">        <div class=\\\"dc:title\\\">Begitt2014
        - STAT1 cooperative DNA binding - single GAS polymer model</div>            <div
        class=\\\"dc:description\\\">      <p>The importance of STAT1-cooperative
        DNA binding in type 1 and type 2 interferon signalling has been studies using
        experimental and modelling approaches. The authors have developed two ODE
        models to describe STAT1 binding to short promoter regions of DNA, namely
        \\\"single GAS polymer model\\\" and \\\"double GAS polymer model\\\" considering
        binding to single or double GAS sites, respectively. The length of DNA in
        the single GAS model was three sites and four sites in double GAS model. This
        model correspond to the \\\"single GAS polymer model\\\".</p>                </div>
        \           <div class=\\\"dc:bibliographicCitation\\\">      <p>This model
        is described in the article:</p>                <div class=\\\"bibo:title\\\">
        \       <a href=\\\"http://identifiers.org/pubmed/24413774\\\" title=\\\"Access
        to this publication\\\">STAT1-cooperative DNA binding distinguishes type 1
        from type 2 interferon signaling.</a>                    </div>                <div
        class=\\\"bibo:authorList\\\">Begitt A, Droescher M, Meyer T, Schmid CD, Baker
        M, Antunes F, Owen MR, Naumann R, Decker T, Vinkemeier U</div>                <div
        class=\\\"bibo:Journal\\\">Nat Immunol. 2014 Feb;15(2):168-76.</div>                <p>Abstract:</p>
        \               <div class=\\\"bibo:abstract\\\">        <p>STAT1 is an indispensable
        component of a heterotrimer (ISGF3) and a STAT1 homodimer (GAF) that function
        as transcription regulators in type 1 and type 2 interferon signaling, respectively.
        To investigate the importance of STAT1-cooperative DNA binding, we generated
        gene-targeted mice expressing cooperativity-deficient STAT1 with alanine substituted
        for Phe77. Neither ISGF3 nor GAF bound DNA cooperatively in the STAT1F77A
        mouse strain, but type 1 and type 2 interferon responses were affected differently.
        Type 2 interferon-mediated transcription and antibacterial immunity essentially
        disappeared owing to defective promoter recruitment of GAF. In contrast, STAT1
        recruitment to ISGF3 binding sites and type 1 interferon-dependent responses,
        including antiviral protection, remained intact. We conclude that STAT1 cooperativity
        is essential for its biological activity and underlies the cellular responses
        to type 2, but not type 1 interferon.</p>                    </div>                </div>
        \           <div class=\\\"dc:publisher\\\">      <p>This model is hosted
        on        <a href=\\\"http://www.ebi.ac.uk/biomodels/\\\">BioModels Database</a>
        \           and identifiedby:        <a href=\\\"http://identifiers.org/biomodels.db/BIOMD0000000500\\\">BIOMD0000000500</a>
        \           .        </p>                <p>To cite BioModels Database, please
        use:        <a href=\\\"http://identifiers.org/pubmed/20587024\\\" title=\\\"Latest
        BioModels Database publication\\\">BioModels Database: An enhanced, curated
        and annotated resourcefor published quantitative kinetic models</a>            .
        \       </p>                </div>            <div class=\\\"dc:license\\\">
        \     <p>To the extent possible under law, all copyright and related orneighbouring
        rights to this encoded model have been dedicated to the publicdomain worldwide.
        Please refer to        <a href=\\\"http://creativecommons.org/publicdomain/zero/1.0/\\\"
        title=\\\"Access to: CC0 1.0 Universal (CC0 1.0), Public Domain Dedication\\\">CC0
        Public DomainDedication</a>            for more information.        </p>                </div>
        \           </body>          </notes>\",\r\n  \"format\" : {\r\n    \"name\"
        : \"SBML\",\r\n    \"identifier\" : \"SBML\",\r\n    \"version\" : \"L2V4\"\r\n
        \ },\r\n  \"publication\" : {\r\n    \"type\" : \"PubMed ID\",\r\n    \"accession\"
        : \"24413774\",\r\n    \"journal\" : \"Nature immunology\",\r\n    \"title\"
        : \"STAT1-cooperative DNA binding distinguishes type 1 from type 2 interferon
        signaling.\",\r\n    \"affiliation\" : \"1] School of Life Sciences, University
        of Nottingham, Nottingham, UK. [2].\",\r\n    \"synopsis\" : \"STAT1 is an
        indispensable component of a heterotrimer (ISGF3) and a STAT1 homodimer (GAF)
        that function as transcription regulators in type 1 and type 2 interferon
        signaling, respectively. To investigate the importance of STAT1-cooperative
        DNA binding, we generated gene-targeted mice expressing cooperativity-deficient
        STAT1 with alanine substituted for Phe77. Neither ISGF3 nor GAF bound DNA
        cooperatively in the STAT1F77A mouse strain, but type 1 and type 2 interferon
