      string: "<?xml version='1.0' encoding='UTF-8' standalone='no'?>\r\n<sbml xmlns=\"http://www.sbml.org/sbml/level3/version1/core\"
        level=\"3\" metaid=\"f19f673f-225d-4e55-a1e3-6f3d38721647\" qual:required=\"true\"
        version=\"1\" xmlns:qual=\"http://www.sbml.org/sbml/level3/version1/qual/version1\">\r\n
        \ <model id=\"MODEL1411240000\" metaid=\"_47f3d7b1-7b24-4193-8878-6fed9eca24f0\"
        name=\"Chaouiya2013 - EGF and TNFalpha mediated signalling pathway\">\r\n
        \   <notes>\r\n      <body xmlns=\"http://www.w3.org/1999/xhtml\">\r\n    <div
        class=\"dc:title\">Chaouiya2013 - EGF and TNFalpha mediated signalling pathway</div>\r\n<div
        class=\"dc:bibliographicCitation\">\r\n  <p>This model is described in the
        article:</p>\r\n  <div class=\"bibo:title\">\r\n    <a href=\"http://identifiers.org/pubmed/24321545\"
        title=\"Access to this publication\">SBML qualitative models: a\r\n    model
        representation format and infrastructure to foster\r\n    interactions between
        qualitative modelling formalisms and\r\n    tools.</a>\r\n  </div>\r\n  <div
        class=\"bibo:authorList\">Chaouiya C, B\xE9renguier D,\r\n  Keating SM, Naldi
        A, van Iersel MP, Rodriguez N, Dr\xE4ger A,\r\n  B\xFCchel F, Cokelaer T,
        Kowal B, Wicks B, Gon\xE7alves E,\r\n  Dorier J, Page M, Monteiro PT, von
        Kamp A, Xenarios I, de Jong H,\r\n  Hucka M, Klamt S, Thieffry D, Le Nov\xE8re
        N, Saez-Rodriguez J,\r\n  Helikar T.</div>\r\n  <div class=\"bibo:Journal\">BMC
        Syst Biol 2013; 7: 135</div>\r\n  <p>Abstract:</p>\r\n  <div class=\"bibo:abstract\">\r\n
        \   <p>BACKGROUND: Qualitative frameworks, especially those based\r\n    on
        the logical discrete formalism, are increasingly used to\r\n    model regulatory
        and signalling networks. A major advantage of\r\n    these frameworks is that
        they do not require precise\r\n    quantitative data, and that they are well-suited
        for studies of\r\n    large networks. While numerous groups have developed
        specific\r\n    computational tools that provide original methods to analyse\r\n
        \   qualitative models, a standard format to exchange qualitative\r\n    models
        has been missing. RESULTS: We present the Systems\r\n    Biology Markup Language
        (SBML) Qualitative Models Package\r\n    (\"qual\"), an extension of the SBML
        Level 3 standard designed\r\n    for computer representation of qualitative
        models of biological\r\n    networks. We demonstrate the interoperability
        of models via\r\n    SBML qual through the analysis of a specific signalling
        network\r\n    by three independent software tools. Furthermore, the\r\n    collective
        effort to define the SBML qual format paved the way\r\n    for the development
        of LogicalModel, an open-source model\r\n    library, which will facilitate
        the adoption of the format as\r\n    well as the collaborative development
        of algorithms to analyse\r\n    qualitative models. CONCLUSIONS: SBML qual
        allows the exchange\r\n    of qualitative models among a number of complementary
        software\r\n    tools. SBML qual has the potential to promote collaborative\r\n
        \   work on the development of novel computational approaches, as\r\n    well
        as on the specification and the analysis of comprehensive\r\n    qualitative
        models of regulatory and signalling networks.</p>\r\n  </div>\r\n</div>\r\n<div
        class=\"dc:publisher\">\r\n  <p>This model is hosted on \r\n  <a href=\"http://www.ebi.ac.uk/biomodels/\">BioModels
        Database</a>\r\n  and identified by: \r\n  <a href=\"http://identifiers.org/biomodels.db/BIOMD0000000562\">BIOMD0000000562</a>.</p>\r\n
        \ <p>To cite BioModels Database, please use: \r\n  <a href=\"http://identifiers.org/pubmed/20587024\"
        title=\"Latest BioModels Database publication\">BioModels Database:\r\n  An
        enhanced, curated and annotated resource for published\r\n  quantitative kinetic
        models</a>.</p>\r\n</div>\r\n<div class=\"dc:license\">\r\n  <p>To the extent
        possible under law, all copyright and related or\r\n  neighbouring rights
        to this encoded model have been dedicated to\r\n  the public domain worldwide.
        Please refer to \r\n  <a href=\"http://creativecommons.org/publicdomain/zero/1.0/\"
        title=\"Access to: CC0 1.0 Universal (CC0 1.0), Public Domain Dedication\">CC0\r\n
        \ Public Domain Dedication</a> for more information.</p>\r\n</div>\r\n</body>\r\n
