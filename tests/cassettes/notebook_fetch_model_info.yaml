      string: "{\r\n  \"name\" : \"Chaouiya2013 - EGF and TNFalpha mediated signalling
        pathway\",\r\n  \"description\" : \"<notes xmlns=\\\"http://www.sbml.org/sbml/level3/version1/core\\\">
        \     <body xmlns=\\\"http://www.w3.org/1999/xhtml\\\">    <div class=\\\"dc:title\\\">Chaouiya2013
        - EGF and TNFalpha mediated signalling pathway</div><div class=\\\"dc:bibliographicCitation\\\">
        \ <p>This model is described in the article:</p>  <div class=\\\"bibo:title\\\">
        \   <a href=\\\"http://identifiers.org/pubmed/24321545\\\" title=\\\"Access
        to this publication\\\">SBML qualitative models: a    model representation
        format and infrastructure to foster    interactions between qualitative modelling
        formalisms and    tools.</a>  </div>  <div class=\\\"bibo:authorList\\\">Chaouiya
        C, B\xE9renguier D,  Keating SM, Naldi A, van Iersel MP, Rodriguez N, Dr\xE4ger
        A,  B\xFCchel F, Cokelaer T, Kowal B, Wicks B, Gon\xE7alves E,  Dorier J,
        Page M, Monteiro PT, von Kamp A, Xenarios I, de Jong H,  Hucka M, Klamt S,
        Thieffry D, Le Nov\xE8re N, Saez-Rodriguez J,  Helikar T.</div>  <div class=\\\"bibo:Journal\\\">BMC
        Syst Biol 2013; 7: 135</div>  <p>Abstract:</p>  <div class=\\\"bibo:abstract\\\">
        \   <p>BACKGROUND: Qualitative frameworks, especially those based    on the
        logical discrete formalism, are increasingly used to    model regulatory and
        signalling networks. A major advantage of    these frameworks is that they
        do not require precise    quantitative data, and that they are well-suited
        for studies of    large networks. While numerous groups have developed specific
        \   computational tools that provide original methods to analyse    qualitative
        models, a standard format to exchange qualitative    models has been missing.
        RESULTS: We present the Systems    Biology Markup Language (SBML) Qualitative
        Models Package    (\\\"qual\\\"), an extension of the SBML Level 3 standard
        designed    for computer representation of qualitative models of biological
        \   networks. We demonstrate the interoperability of models via    SBML qual
        through the analysis of a specific signalling network    by three independent
        software tools. Furthermore, the    collective effort to define the SBML qual
        format paved the way    for the development of LogicalModel, an open-source
        model    library, which will facilitate the adoption of the format as    well
        as the collaborative development of algorithms to analyse    qualitative models.
        CONCLUSIONS: SBML qual allows the exchange    of qualitative models among
        a number of complementary software    tools. SBML qual has the potential to
        promote collaborative    work on the development of novel computational approaches,
        as    well as on the specification and the analysis of comprehensive    qualitative
        models of regulatory and signalling networks.</p>  </div></div><div class=\\\"dc:publisher\\\">
        \ <p>This model is hosted on   <a href=\\\"http://www.ebi.ac.uk/biomodels/\\\">BioModels
        Database</a>  and identified by:   <a href=\\\"http://identifiers.org/biomodels.db/BIOMD0000000562\\\">BIOMD0000000562</a>.</p>
        \ <p>To cite BioModels Database, please use:   <a href=\\\"http://identifiers.org/pubmed/20587024\\\"
        title=\\\"Latest BioModels Database publication\\\">BioModels Database:  An
        enhanced, curated and annotated resource for published  quantitative kinetic
        models</a>.</p></div><div class=\\\"dc:license\\\">  <p>To the extent possible
        under law, all copyright and related or  neighbouring rights to this encoded
        model have been dedicated to  the public domain worldwide. Please refer to
        \  <a href=\\\"http://creativecommons.org/publicdomain/zero/1.0/\\\" title=\\\"Access
        to: CC0 1.0 Universal (CC0 1.0), Public Domain Dedication\\\">CC0  Public
        Domain Dedication</a> for more information.</p></div></body>    </notes>\",\r\n
        \ \"format\" : {\r\n    \"name\" : \"SBML\",\r\n    \"identifier\" : \"SBML\",\r\n
