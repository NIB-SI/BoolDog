name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BoolDog with test extras
        run: pip install .[networks,sbml,biomodels,test]

      - name: Run tests
        run: python -m unittest discover .
        working-directory: tests

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          python3 - "$BUMP" <<'EOF'
          import re, os, sys
          bump = sys.argv[1]
          path = "pyproject.toml"
          text = open(path).read()
          match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find a version = \"X.Y.Z\" line in pyproject.toml")
          major, minor, patch = map(int, match.groups())
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new_version = f"{major}.{minor}.{patch}"
          new_text = text[:match.start()] + f'version = "{new_version}"' + text[match.end():]
          open(path, "w").write(new_text)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
          print(f"Bumped {match.group(0)!r} -> version = \"{new_version}\"")
          EOF
        env:
          BUMP: ${{ inputs.bump }}

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version to $VERSION"
          # Matches the existing 0.1.0 tag's convention: bare version, no "v" prefix.
          git tag "$VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Release name is the bare version (no "v" prefix), for consistency with the tag.
          gh release create "$VERSION" --title "$VERSION" --generate-notes

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build release distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly
    # recommended, e.g. required reviewers: repo Settings -> Environments ->
    # pypi -> Deployment protection rules. See:
    # https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/BoolDog/${{ needs.release.outputs.version }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
